<div class="rules-modal-overlay" [ngClass]="showRulesModal ? 'show' : 'hide'">
    <div class="game-rules-modal">
        <div class="modal-inner">

            <div class="modal-header">
                <div class="modal-title-group">
                    <div class="modal-icon">🎣</div>
                    <div>
                        <div class="modal-title">How to Play</div>
                        <div class="modal-subtitle">Swindler · Game Rules</div>
                    </div>
                </div>
                <button class="close-btn" (click)="closeModal()">✕</button>
            </div>

            <div class="modal-divider"></div>

            <div class="rules-list">
                <div class="rule-card" *ngFor="let rule of Game_Rules; let i = index" [class.open]="openIndex === i">

                    <button class="rule-trigger" (click)="toggleRule(i)">
                        <div class="rule-accent" [style.background]="ruleAccents[i % ruleAccents.length]"></div>
                        <div class="rule-meta">
                            <div class="rule-number">Rule {{ (i + 1).toString().padStart(2, '0') }}</div>
                            <div class="rule-title">{{ rule.title }}</div>
                        </div>
                        <div class="chevron">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="6 9 12 15 18 9" />
                            </svg>
                        </div>
                    </button>

                    <div class="rule-body">
                        <div class="rule-body-inner">
                            <div class="rule-step" *ngFor="let step of rule.steps">
                                <div class="rule-step-dot"></div>
                                <span>{{ step }}</span>
                            </div>
                            <div class="rule-desc" *ngIf="rule.description">{{ rule.description }}</div>
                        </div>
                    </div>

                </div>
            </div>

            <div class="modal-footer">
                <button class="got-it-btn" (click)="closeModal()">Got it, let's play! </button>
            </div>

        </div>
    </div>
</div>
